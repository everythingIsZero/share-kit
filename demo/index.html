<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>share-kit 真机验证台</title>
  <style>
    body { font-family: -apple-system, 'PingFang SC', sans-serif; margin: 16px; background: #f5f6f8; color: #222; }
    h1 { font-size: 17px; }
    h2 { font-size: 14px; margin: 20px 0 8px; color: #555; }
    .intro { background: #e8f5ee; border: 1px solid #bfe5d2; border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.7; color: #1a5c38; margin: 12px 0; }
    /* 海报原稿 750px，capture 完成后 JS 等比缩到容器宽（一屏看全貌） */
    #poster-host { width: 100%; overflow: hidden; }
    #result { max-width: 100%; border: 1px solid #ddd; border-radius: 8px; display: none; }
    #status { color: #666; font-size: 13px; margin: 10px 0; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px; font-size: 13px; line-height: 1.8; }
    .kv { display: flex; justify-content: space-between; gap: 12px; }
    .kv b { font-weight: 600; color: #444; flex-shrink: 0; }
    .mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
    /* 分享按钮 / Action Sheet / 长按引导层的样式均由 SDK 注入（share-kit-ui-style） */
    #share-slot { margin-top: 10px; }
    /* ④ 各环境行为预览矩阵：当前环境行高亮 */
    .env-row { border: 1px solid #e5e7eb; border-left: 3px solid #d1d5db; border-radius: 8px; padding: 8px 12px; margin: 6px 0; background: #fff; font-size: 13px; line-height: 1.7; }
    .env-row.current { border-left-color: #07c160; background: #f2fbf6; }
    .env-row .env-name { font-weight: 600; }
    .env-row .env-here { font-size: 11px; color: #07c160; border: 1px solid rgba(7,193,96,.4); border-radius: 4px; padding: 0 5px; margin-left: 6px; }
    .env-row .env-behavior { color: #222; }
    .env-row .env-how { color: #777; font-size: 12px; }
  </style>
</head>
<body>
  <h1>share-kit 真机验证台（海报渲染 + 环境决策分享）</h1>
  <div class="intro">
    本页 = <b>业务站接入后的实际效果</b>：下面的海报 / 环境卡是业务页面自己的内容，
    「③ 分享」区里那颗按钮就是接入的全部——SDK 只在挂载点插按钮、点击后弹浮层，
    不改页面其余任何东西。接入方式与作用域声明见 <a href="https://github.com/everythingIsZero/share-kit#接入">README · 接入</a>。
  </div>
  <div id="status">正在生成海报…</div>

  <!-- ① 海报区：posterHtml 注入，capture 抓取（Playwright 验收锚点，勿改名） -->
  <h2>① 海报渲染（zbh 车销场景样例）</h2>
  <div id="poster-host"></div>
  <img id="result" alt="海报导出结果" />

  <!-- ② 环境识别：fingerprint + 运行时信号（真机验证时截图回填能力表用） -->
  <h2>② 环境识别（真机验证请截图这一卡）</h2>
  <div class="card" id="env-card">采集中…</div>

  <!-- ③ 分享操作：mountShare 挂载（Action Sheet：点击弹出该环境真实可用的方式） -->
  <h2>③ 分享 / 保存（点击弹出可用方式 · 主推荐高亮）</h2>
  <div id="share-slot"></div>

  <!-- ④ 各环境行为预览：listActions 纯函数喂模拟指纹，与真实点击共用决策单源 -->
  <h2>④ 各环境点「分享海报」会发生什么（同一份 SDK，不同终端）</h2>
  <div id="env-matrix"></div>

  <script type="module">
    // poster / core / web / ui 四入口零依赖纯 ESM，直接引源码；render-dom 带 CJS 依赖（qrcode），走打包产物
    import { resolveSpec } from '../src/poster/index.mjs'
    import { normalizeFingerprint, decideAction, listActions } from '../src/core/index.mjs'
    import { envKeyFor } from '../src/core/capability-table.mjs'
    import { sheetItemsOf } from '../src/ui/view.mjs'
    import { collectSignals } from '../src/web/index.mjs'
    import { mountShare } from '../src/ui/index.mjs'
    import { qrDataUrl, posterHtml, capture, exportPng } from './render-dom.bundle.mjs'

    // 样例业务输入（zbh 车销报价场景，模拟业务站数据）
    const input = {
      format: 'card',
      themeId: 'celebration',
      content: {
        headline: '2025款 轩逸·经典版',
        subline: '限时一口价 · 综合优惠 2.3 万',
        facts: [
          { label: '裸车价', value: '¥7.98万起' },
          { label: '首付', value: '¥2.4万' },
          { label: '月供', value: '¥1,688 × 36期' },
          { label: '落地总价', value: '¥8.86万' },
        ],
        owner: '桂林懂车弟 · 陈顾问',
        cta: '长按识别二维码 · 获取最新报价',
      },
      qr: { url: 'https://share.hxym18.com/s/demo001' },
    }

    const status = document.getElementById('status')

    // ── 环境决策（页面加载即采集首帧；列表供环境卡展示与验收断言） ──────────
    const signals = collectSignals()
    // normalizeFingerprint 返回 { fingerprint, signals } 包装——决策要传解构出的四维指纹
    const { fingerprint } = normalizeFingerprint(signals)
    const plan = decideAction({ fingerprint, artifactKind: 'image', signals })
    const firstList = listActions({ fingerprint, artifactKind: 'image', signals })

    const envCard = document.getElementById('env-card')
    envCard.innerHTML = [
      ['容器 container', fingerprint.container],
      ['系统 os', fingerprint.os],
      ['引擎 engine', fingerprint.engine],
      ['版本带 versionBand', fingerprint.versionBand],
      ['canShareFiles', String(signals.canShareFiles)],
      ['hasDownloadAttr', String(signals.hasDownloadAttr)],
      ['首帧动作 primary', plan.primary],
      ['reason', plan.reason],
      ['首帧可用方式', firstList.actions.map((a) => a.id).join('  ›  ')],
    ].map(([k, v]) => `<div class="kv"><b>${k}</b><span class="mono">${v ?? 'null'}</span></div>`).join('')

    // 供自动化验收读取（Playwright 多 UA 场景断言环境识别与决策）
    window.__verifyEnv = { fingerprint, signals, plan, firstList }

    // ── 各环境行为预览（④ 矩阵） ─────────────────────────────────────────
    // listActions 是纯函数：喂入模拟指纹即可预览任意环境点击后的行为，
    // 与真实点击共用同一决策单源——这里不维护第二份「环境对照表」。
    // signals 取「点击瞬间」的典型值（hasTransientActivation: true），
    // 因为系统分享只有在那一刻才过得了信号闸（见 README 接入说明）。
    const ENV_PREVIEW = [
      {
        keys: ['wechat:ios', 'wechat:android'], label: '微信内打开（手机）',
        signals: { canShareFiles: false, hasTransientActivation: true, hasDownloadAttr: false },
        how: '长按弹出的海报图 → 菜单选「保存图片」或「发送给朋友」（图片消息）',
      },
      {
        keys: ['wechat-desktop:macos', 'wechat-desktop:windows'], label: '微信内打开（PC）',
        signals: { canShareFiles: false, hasTransientActivation: true, hasDownloadAttr: true },
        how: '下载海报 PNG 到本机，再发给客户',
      },
      {
        keys: ['browser:ios'], label: '手机浏览器（iOS Safari / Chrome）',
        signals: { canShareFiles: true, hasTransientActivation: true, hasDownloadAttr: false },
        how: '系统分享面板里选微信 → 以图片发送给朋友',
      },
      {
        keys: ['browser:android'], label: '手机浏览器（Android）',
        signals: { canShareFiles: true, hasTransientActivation: true, hasDownloadAttr: true },
        how: '系统分享面板里选微信 → 以图片发送给朋友',
      },
      {
        keys: ['browser:macos', 'browser:windows'], label: '电脑浏览器',
        signals: { canShareFiles: true, hasTransientActivation: true, hasDownloadAttr: true },
        how: '系统分享或下载 PNG',
      },
      {
        keys: ['wechat-miniprogram-webview:ios', 'wechat-miniprogram-webview:android'], label: '小程序 web-view',
        signals: { canShareFiles: false, hasTransientActivation: true, hasDownloadAttr: true },
        how: '复制链接到微信对话打开；转发由宿主小程序自己的分享菜单负责',
      },
    ]

    const currentEnvKey = envKeyFor(fingerprint)
    const matrix = document.getElementById('env-matrix')
    matrix.innerHTML = ENV_PREVIEW.map((env) => {
      const [container, os] = env.keys[0].split(':')
      const fp = { container, os, engine: 'unknown', versionBand: 'unknown' }
      const list = listActions({ fingerprint: fp, artifactKind: 'image', signals: env.signals })
      const items = sheetItemsOf(list, 'image', null)
      // 三种交互形态，与 mountShare 点击行为一一对应：长按直出 / 唯一动作直出 / 弹列表
      let behavior
      if (list.actions[0].id === 'preview.longpress') {
        behavior = '点按钮直接弹大图（长按可保存 / 发送给朋友，层内另有「复制链接」）'
      } else if (items.length === 1) {
        behavior = `点按钮不弹列表，直接执行「${items[0].label}」`
      } else {
        behavior = `点按钮弹方式列表：${items.map((it) => (it.isPrimary ? `${it.label}（推荐）` : it.label)).join(' / ')}`
      }
      const here = env.keys.includes(currentEnvKey)
      return `<div class="env-row${here ? ' current' : ''}">
        <div class="env-name">${env.label}${here ? '<span class="env-here">你在这里</span>' : ''}</div>
        <div class="env-behavior">${behavior}</div>
        <div class="env-how">保存 / 转发怎么完成：${env.how}</div>
      </div>`
    }).join('')
    window.__envMatrix = ENV_PREVIEW.map((env) => env.keys.includes(currentEnvKey) ? env.keys[0] : null).filter(Boolean)

    // ── 分享产物（可变引用：mountShare 执行时取值，渲染完成后补 files / imageUrl） ──
    const artifact = {
      kind: 'image',
      url: location.href,
      title: input.content.headline,
      text: input.content.subline,
      filename: 'share-kit-poster.png',
    }

    // ── 海报渲染链 ──────────────────────────────────────────────────────
    // 海报 750px 原稿缩到容器宽（一屏看全貌）；缩放发生在 capture 之后，不影响渲染铁律
    function fitPoster() {
      const host = document.getElementById('poster-host')
      const poster = host.firstElementChild
      if (!poster) return
      const scale = Math.min(1, host.clientWidth / poster.offsetWidth)
      poster.style.transformOrigin = 'top left'
      poster.style.transform = scale < 1 ? `scale(${scale})` : ''
      host.style.height = scale < 1 ? `${Math.round(poster.offsetHeight * scale)}px` : ''
    }
    window.addEventListener('resize', fitPoster)

    async function render() {
      const spec = resolveSpec(input)
      const qrSrc = await qrDataUrl(spec.qr)
      const html = posterHtml(spec, { qrDataUrl: qrSrc })
      const host = document.getElementById('poster-host')
      host.innerHTML = html
      const canvas = await capture(host.firstElementChild)
      if (!canvas) throw new Error('海报画布两档预算均失败')
      const exported = await exportPng(canvas)
      // 预构造 File（点击回调同步段直接可用，R14）
      const blob = exported.blob ?? (await (await fetch(exported.url)).blob())
      artifact.files = [new File([blob], 'share-kit-poster.png', { type: 'image/png' })]
      artifact.imageUrl = exported.url

      const img = document.getElementById('result')
      img.src = exported.url
      img.style.display = 'block'
      status.textContent = `海报完成：${canvas.width}×${canvas.height}（导出 ${exported.kind}，原稿 750px 已缩放适配屏幕）`
      fitPoster()

      // 产物就绪后挂载 Action Sheet 形态分享（按钮 + sheet + 长按引导层 + 执行全在 SDK 内）
      window.__share = mountShare(document.getElementById('share-slot'), {
        artifact,
        labels: { button: '分享海报', sheetTitle: '分享这张海报' },
        onResult: (r) => { window.__lastResult = r },
      })
      // 供 Playwright 验收断言（契约：canvas / spec / exported）
      window.__poster = { canvas, spec, exported }
    }

    render().catch((err) => {
      status.textContent = `失败：${err && err.message ? err.message : err}`
      window.__posterError = String(err)
    })
  </script>
</body>
</html>
